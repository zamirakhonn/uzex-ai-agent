services:
  - type: web
    name: uzex-ai-agent-webhook
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: uzex-ai-agent-webhook
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENABLE_LLM_SQL
        value: "true"
