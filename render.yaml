services:
  - type: worker
    name: uzex-ai-agent-polling
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python src/bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_LLM_SQL
        value: "true"
